[project]
name = "kuramoto-template"
version = "0.1.0"
description = "Reproducible joint limiting SDP experiments for Kuramoto S7 templates"
readme = "README.md"
authors = [
    { name = "Lucas", email = "lucasgrassoramos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "clarabel>=0.11.1",
    "cvxpy>=1.9.3",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[project.scripts]
kuramoto-template = "kuramoto_template.asymptotic_search.joint_outer:main"

[project.optional-dependencies]
reports = ["matplotlib>=3.11.2,<4"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["src/kuramoto_template"]
markers = ["integration: exercises real conic solvers"]
